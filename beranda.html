<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#313083">
  <title>Nilai STS — Portal Orang Tua</title>
  <link rel="icon" type="image/png" href="assets/favicon-32.png">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    body { background: var(--canvas-app); min-height: 100vh; }
    .topbar {
      background: var(--canvas);
      border-bottom: 1px solid var(--hairline);
      padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
    }
    .topbar-inner {
      max-width: 640px; margin: 0 auto;
      display: flex; align-items: center; gap: 12px;
    }
    .topbar img {
      width: 36px; height: 36px; border-radius: 8px;
      background: var(--brand-tint); padding: 4px; object-fit: contain;
    }
    .topbar h1 {
      margin: 0; font-size: 15px; font-weight: 600;
      letter-spacing: -0.01em; flex: 1;
    }
    .topbar .sub { font-size: 12px; color: var(--ink-mute); font-weight: 500; }
    .btn-out {
      border: 1px solid var(--hairline); background: #fff;
      border-radius: 8px; padding: 8px 12px;
      font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer;
    }
    .page { max-width: 640px; margin: 0 auto; padding: 16px 14px 40px; }

    .profile {
      display: flex; align-items: center; gap: 12px;
      background: var(--canvas); border: 1px solid var(--hairline);
      border-radius: var(--radius-card); padding: 14px 16px; margin-bottom: 16px;
    }
    .avatar {
      width: 44px; height: 44px; border-radius: 999px;
      background: var(--brand-tint); color: var(--brand);
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 14px; flex-shrink: 0;
    }
    .profile .nama { font-size: 15px; font-weight: 600; }
    .profile .meta { font-size: 12px; color: var(--ink-mute); margin-top: 2px; }
    .kelas-pill {
      margin-left: auto; font-size: 12px; font-weight: 600;
      background: var(--brand-tint); color: var(--brand);
      padding: 5px 10px; border-radius: 999px;
    }

    .period {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin-bottom: 10px; flex-wrap: wrap;
    }
    .period-label { font-size: 13px; font-weight: 600; color: var(--ink-mute); }
    .section-h {
      font-size: 12px; font-weight: 600; color: var(--ink-mute);
      text-transform: uppercase; letter-spacing: 0.03em; margin: 0 0 10px;
    }

    .nilai-list { display: flex; flex-direction: column; gap: 8px; }
    .nilai-row {
      display: flex; align-items: center; gap: 12px;
      background: var(--canvas); border: 1px solid var(--hairline);
      border-radius: var(--radius-card); padding: 12px 14px;
    }
    .nilai-row .mapel { flex: 1; min-width: 0; }
    .nilai-row .mapel-name { font-size: 14px; font-weight: 600; }
    .nilai-row .mapel-sub { font-size: 12px; color: var(--ink-mute); margin-top: 2px; }
    .nilai-row .skor {
      font-size: 22px; font-weight: 600; color: var(--brand);
      font-variant-numeric: tabular-nums; line-height: 1;
    }
    .nilai-row .pred {
      font-size: 11px; font-weight: 600; color: var(--ink-mute);
      text-align: right; margin-top: 3px;
    }

    .state {
      background: var(--canvas); border: 1px solid var(--hairline);
      border-radius: var(--radius-card); padding: 28px 18px; text-align: center;
    }
    .state h3 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
    .state p { margin: 0; font-size: 13px; color: var(--ink-mute); line-height: 1.5; }
    .foot {
      margin-top: 20px; text-align: center;
      font-size: 12px; color: var(--ink-mute); line-height: 1.5;
    }
    .loading { text-align: center; padding: 32px; color: var(--ink-mute); font-size: 13px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <img src="assets/logo.png" alt="" onerror="this.style.display='none'">
      <div style="flex:1;min-width:0">
        <h1>Portal Orang Tua</h1>
        <div class="sub" id="headerNama">—</div>
      </div>
      <button type="button" class="btn-out" id="btnLogout">Keluar</button>
    </div>
  </header>

  <main class="page">
    <div class="profile" id="profileCard">
      <div class="avatar" id="avatarInisial">—</div>
      <div style="min-width:0;flex:1">
        <div class="nama" id="profilNama">—</div>
        <div class="meta" id="profilMeta">—</div>
      </div>
      <div class="kelas-pill" id="profilKelas">—</div>
    </div>

    <div class="section-h">Nilai STS</div>
    <div class="period">
      <span class="period-label" id="periodText">Semester berjalan</span>
      <span class="badge badge-pending" id="statusChip">Memuat…</span>
    </div>
    <div id="nilaiArea"><div class="loading">Memuat nilai…</div></div>
    <p class="foot">
      Nilai tampil setelah guru mengisi STS
      (dan publikasi kelas, bila diaktifkan).<br>
      Hubungi wali kelas jika ada pertanyaan.
    </p>
  </main>

  <div class="toast" id="toast"><span id="toastMsg"></span></div>

  <script type="module">
    import {
      currentSession,
      onAuthChange,
      logout,
      loadSiswaByIds,
      loadNilaiStsPublished,
    } from './assets/firebase.js?v=20261028g';

    const $ = (id) => document.getElementById(id);

    function inisial(nama) {
      if (!nama) return '?';
      const p = nama.trim().split(/\s+/);
      return p.length === 1
        ? p[0].slice(0, 2).toUpperCase()
        : (p[0][0] + p[p.length - 1][0]).toUpperCase();
    }
    function escapeHtml(s) {
      return String(s || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    let aktifId = null;

    function renderProfil(anak) {
      if (!anak) return;
      $('avatarInisial').textContent = inisial(anak.nama);
      $('profilNama').textContent = anak.nama;
      $('profilMeta').textContent = [
        anak.nis ? `NIS ${anak.nis}` : null,
        anak.kelas ? `Kelas ${anak.kelas}` : null,
      ].filter(Boolean).join(' · ') || '—';
      $('profilKelas').textContent = anak.kelas ? `Kelas ${anak.kelas}` : '—';
    }

    function renderNilai(result) {
      $('periodText').textContent = result.periodeLabel || 'Semester berjalan';
      const chip = $('statusChip');
      if (!result.published) {
        chip.textContent = 'Belum tersedia';
        chip.className = 'badge badge-pending';
        $('nilaiArea').innerHTML = `
          <div class="state">
            <h3>Nilai STS belum tersedia</h3>
            <p>Guru belum mengisi atau mempublikasikan nilai STS untuk periode ini.</p>
          </div>`;
        return;
      }
      chip.textContent = result.publishedAt
        ? `Dipublish ${result.publishedAt}`
        : 'Tersedia';
      chip.className = 'badge badge-ok';

      const items = result.items || [];
      if (!items.length) {
        $('nilaiArea').innerHTML = `
          <div class="state">
            <h3>Belum ada nilai</h3>
            <p>Tidak ada data STS untuk anak ini pada periode berjalan.</p>
          </div>`;
        return;
      }
      $('nilaiArea').innerHTML =
        `<div class="nilai-list">` +
        items
          .map(
            (n) => `
          <div class="nilai-row">
            <div class="mapel">
              <div class="mapel-name">${escapeHtml(n.mapel)}</div>
              <div class="mapel-sub">${escapeHtml(n.keterangan || 'Nilai STS')}</div>
            </div>
            <div>
              <div class="skor">${n.nilai != null ? n.nilai : '—'}</div>
              <div class="pred">${escapeHtml(n.predikat || '')}</div>
            </div>
          </div>`
          )
          .join('') +
        `</div>`;
    }

    async function boot(s) {
      if (!s || s.role !== 'orangtua') {
        window.location.href = 'index.html';
        return;
      }
      $('headerNama').textContent = s.nama || 'Orang tua';
      aktifId = s.siswaAktifId || (s.anakIds && s.anakIds[0]);
      if (!aktifId) {
        $('nilaiArea').innerHTML = `<div class="state"><h3>Tidak ada data anak</h3></div>`;
        return;
      }
      try {
        const list = await loadSiswaByIds([aktifId]);
        renderProfil(list[0] || { id: aktifId, nama: s.siswaNama || aktifId, kelas: s.siswaKelas || '' });
      } catch (_) {
        renderProfil({ id: aktifId, nama: s.siswaNama || aktifId, kelas: s.siswaKelas || '' });
      }
      try {
        const result = await loadNilaiStsPublished(aktifId);
        renderNilai(result);
      } catch (err) {
        console.error(err);
        $('nilaiArea').innerHTML = `<div class="state"><h3>Gagal memuat nilai</h3><p>Periksa koneksi atau rules Firestore.</p></div>`;
      }
    }

    const existing = currentSession();
    if (existing) boot(existing);
    else onAuthChange((s) => boot(s));

    // Ortu NISN session is localStorage-only — onAuthChange may not fire
    if (!existing) {
      setTimeout(() => {
        const s = currentSession();
        if (s) boot(s);
        else window.location.href = 'index.html';
      }, 100);
    }

    $('btnLogout').addEventListener('click', async () => {
      await logout();
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
