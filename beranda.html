<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#313083">
  <title>Beranda — Portal Orang Tua</title>
  <link rel="icon" type="image/png" href="assets/favicon-32.png">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    body {
      background: var(--canvas-app);
      min-height: 100vh;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }

    .appbar {
      background: var(--canvas);
      border-bottom: 1px solid var(--hairline);
      padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .appbar-inner {
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .appbar-logo {
      width: 36px; height: 36px;
      border-radius: 8px;
      background: var(--brand-tint);
      padding: 4px;
      object-fit: contain;
    }
    .appbar-title {
      flex: 1;
      min-width: 0;
    }
    .appbar-title strong {
      display: block;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .appbar-title span {
      font-size: 12px;
      color: var(--ink-mute);
      font-weight: 500;
    }
    .btn-out {
      border: 1px solid var(--hairline);
      background: #fff;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
    }
    .btn-out:hover { background: var(--canvas-app); }

    .wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: 16px 14px 0;
    }

    /* Profil anak */
    .child-card {
      background: var(--canvas);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-card);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }
    .child-av {
      width: 48px; height: 48px;
      border-radius: 999px;
      background: var(--brand-tint);
      color: var(--brand);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 15px;
      flex-shrink: 0;
    }
    .child-info { flex: 1; min-width: 0; }
    .child-name {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.015em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .child-meta {
      font-size: 13px;
      color: var(--ink-mute);
      margin-top: 2px;
    }
    .child-kelas {
      font-size: 12px;
      font-weight: 600;
      color: var(--brand);
      background: var(--brand-tint);
      padding: 5px 10px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    .block-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-mute);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin: 0 0 10px;
    }

    /* Menu nilai yang dibagikan — sekarang hanya STS */
    .share-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 22px;
    }
    .share-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--canvas);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-card);
      padding: 14px 14px;
      text-align: left;
      width: 100%;
      cursor: pointer;
      font-family: inherit;
      color: inherit;
      transition: border-color 0.12s ease, background 0.12s ease;
    }
    .share-item:hover {
      border-color: var(--brand-line);
      background: #fafbff;
    }
    .share-item.is-active {
      border-color: var(--brand-line);
      background: var(--brand-tint);
    }
    .share-item.is-disabled {
      opacity: 0.55;
      cursor: default;
    }
    .share-item.is-disabled:hover {
      border-color: var(--hairline);
      background: var(--canvas);
    }
    .share-icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: var(--brand-tint);
      color: var(--brand);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .share-item.is-disabled .share-icon {
      background: var(--canvas-app);
      color: var(--ink-mute);
    }
    .share-body { flex: 1; min-width: 0; }
    .share-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .share-desc {
      font-size: 12px;
      color: var(--ink-mute);
      margin-top: 2px;
      line-height: 1.4;
    }
    .share-chevron {
      color: var(--ink-mute);
      flex-shrink: 0;
    }

    /* Panel detail STS */
    .detail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .detail-period {
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-mute);
    }

    .nilai-table {
      background: var(--canvas);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-card);
      overflow: hidden;
    }
    .nilai-tr {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 16px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--hairline);
      align-items: center;
    }
    .nilai-tr:last-child { border-bottom: none; }
    .nilai-mapel {
      font-size: 14px;
      font-weight: 500;
    }
    .nilai-sub {
      font-size: 12px;
      color: var(--ink-mute);
      margin-top: 2px;
    }
    .nilai-right { text-align: right; }
    .nilai-angka {
      font-size: 18px;
      font-weight: 600;
      color: var(--brand);
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }
    .nilai-pred {
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-mute);
      margin-top: 3px;
    }

    .state-box {
      background: var(--canvas);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-card);
      padding: 28px 18px;
      text-align: center;
    }
    .state-box h3 {
      margin: 0 0 6px;
      font-size: 15px;
      font-weight: 600;
    }
    .state-box p {
      margin: 0;
      font-size: 13px;
      color: var(--ink-mute);
      line-height: 1.55;
      max-width: 320px;
      margin-left: auto;
      margin-right: auto;
    }

    .foot-note {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--ink-mute);
      line-height: 1.5;
    }

    .loading-line {
      padding: 28px;
      text-align: center;
      color: var(--ink-mute);
      font-size: 13px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <header class="appbar">
    <div class="appbar-inner">
      <img class="appbar-logo" src="assets/logo.png" alt="" onerror="this.style.display='none'">
      <div class="appbar-title">
        <strong>Portal Orang Tua</strong>
        <span id="headerSub">SD Muhammadiyah 01 Kukusan</span>
      </div>
      <button type="button" class="btn-out" id="btnLogout">Keluar</button>
    </div>
  </header>

  <main class="wrap">
    <section class="child-card" aria-label="Profil anak">
      <div class="child-av" id="avatarInisial">—</div>
      <div class="child-info">
        <div class="child-name" id="profilNama">—</div>
        <div class="child-meta" id="profilMeta">—</div>
      </div>
      <div class="child-kelas" id="profilKelas">—</div>
    </section>

    <p class="block-label">Nilai yang dibagikan</p>
    <div class="share-list" id="shareList">
      <button type="button" class="share-item is-active" id="btnShareSts" data-kind="sts">
        <div class="share-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M8 7h8M8 11h6"/></svg>
        </div>
        <div class="share-body">
          <div class="share-title">Sumatif Tengah Semester (STS)</div>
          <div class="share-desc" id="stsShareDesc">Memuat status…</div>
        </div>
        <svg class="share-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </button>

      <!-- Slot masa depan: nilai lain yang dibagikan guru -->
      <div class="share-item is-disabled" aria-disabled="true">
        <div class="share-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>
        </div>
        <div class="share-body">
          <div class="share-title">Nilai lainnya</div>
          <div class="share-desc">Belum tersedia · akan muncul jika guru membagikan</div>
        </div>
      </div>
    </div>

    <div id="detailPanel">
      <div class="detail-head">
        <span class="detail-period" id="periodText">—</span>
        <span class="badge badge-pending" id="statusChip">Memuat</span>
      </div>
      <div id="nilaiArea">
        <div class="loading-line">Memuat nilai STS…</div>
      </div>
    </div>

    <p class="foot-note">
      Hanya nilai yang sudah dipublikasikan guru yang ditampilkan di sini.<br>
      Hubungi wali kelas jika data tidak sesuai.
    </p>
  </main>

  <div class="toast" id="toast"><span id="toastMsg"></span></div>

  <script type="module">
    import {
      currentSession,
      logout,
      loadSiswaByIds,
      loadNilaiStsPublished,
    } from './assets/firebase.js?v=20261028h';

    const $ = (id) => document.getElementById(id);

    function inisial(nama) {
      if (!nama) return '?';
      const p = nama.trim().split(/\s+/);
      return p.length === 1
        ? p[0].slice(0, 2).toUpperCase()
        : (p[0][0] + p[p.length - 1][0]).toUpperCase();
    }
    function escapeHtml(s) {
      return String(s || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    let aktifId = null;

    function renderProfil(anak) {
      $('avatarInisial').textContent = inisial(anak.nama);
      $('profilNama').textContent = anak.nama || '—';
      $('profilMeta').textContent = [
        anak.nis ? `NIS ${anak.nis}` : null,
      ].filter(Boolean).join(' · ') || 'Data siswa';
      $('profilKelas').textContent = anak.kelas ? `Kelas ${anak.kelas}` : '—';
    }

    function renderSts(result) {
      $('periodText').textContent = result.periodeLabel || 'Periode berjalan';
      const chip = $('statusChip');
      const desc = $('stsShareDesc');

      if (!result.published) {
        chip.textContent = 'Belum dipublikasikan';
        chip.className = 'badge badge-pending';
        desc.textContent = 'Menunggu publikasi guru kelas';
        $('nilaiArea').innerHTML = `
          <div class="state-box">
            <h3>Belum dipublikasikan</h3>
            <p>Guru belum membagikan nilai STS untuk periode ini. Silakan cek lagi nanti.</p>
          </div>`;
        return;
      }

      chip.textContent = result.publishedAt
        ? `Dipublikasikan ${result.publishedAt}`
        : 'Dipublikasikan';
      chip.className = 'badge badge-ok';
      desc.textContent = result.publishedAt
        ? `Dipublikasikan ${result.publishedAt}`
        : 'Sudah dipublikasikan';

      const items = result.items || [];
      if (!items.length) {
        $('nilaiArea').innerHTML = `
          <div class="state-box">
            <h3>Tidak ada nilai</h3>
            <p>Publikasi sudah ada, tetapi belum ada data nilai untuk anak ini.</p>
          </div>`;
        return;
      }

      $('nilaiArea').innerHTML =
        `<div class="nilai-table">` +
        items
          .map(
            (n) => `
          <div class="nilai-tr">
            <div>
              <div class="nilai-mapel">${escapeHtml(n.mapel)}</div>
              <div class="nilai-sub">${escapeHtml(n.keterangan || 'Nilai STS')}</div>
            </div>
            <div class="nilai-right">
              <div class="nilai-angka">${n.nilai != null ? n.nilai : '—'}</div>
              <div class="nilai-pred">${escapeHtml(n.predikat || '')}</div>
            </div>
          </div>`
          )
          .join('') +
        `</div>`;
    }

    async function boot() {
      const s = currentSession();
      if (!s || s.role !== 'orangtua') {
        location.href = 'index.html';
        return;
      }
      $('headerSub').textContent = s.nama || 'Orang tua';
      aktifId = s.siswaAktifId || (s.anakIds && s.anakIds[0]);
      if (!aktifId) {
        $('nilaiArea').innerHTML = `<div class="state-box"><h3>Data anak tidak ditemukan</h3></div>`;
        return;
      }

      try {
        const list = await loadSiswaByIds([aktifId]);
        renderProfil(
          list[0] || {
            id: aktifId,
            nama: s.siswaNama || aktifId,
            kelas: s.siswaKelas || '',
            nis: '',
          }
        );
      } catch {
        renderProfil({
          id: aktifId,
          nama: s.siswaNama || aktifId,
          kelas: s.siswaKelas || '',
          nis: '',
        });
      }

      try {
        const result = await loadNilaiStsPublished(aktifId);
        renderSts(result);
      } catch (err) {
        console.error(err);
        $('stsShareDesc').textContent = 'Gagal memuat';
        $('statusChip').textContent = 'Error';
        $('statusChip').className = 'badge badge-off';
        $('nilaiArea').innerHTML = `
          <div class="state-box">
            <h3>Gagal memuat nilai</h3>
            <p>Periksa koneksi internet atau hubungi admin sekolah.</p>
          </div>`;
      }
    }

    boot();
    $('btnLogout').addEventListener('click', async () => {
      await logout();
      location.href = 'index.html';
    });
  </script>
</body>
</html>
