<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Beranda — Portal Orang Tua | SD Muhammadiyah 01 Kukusan</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    body { background: var(--bg-light); min-height: 100vh; }
    .app-header {
      background: var(--header-gradient);
      padding: calc(env(safe-area-inset-top) + 16px) 20px 20px;
      color: #fff;
    }
    .app-header-row { display: flex; align-items: center; gap: 12px; }
    .app-header-title { font-size: 17px; font-weight: 800; flex: 1; }
    .app-header-sub { font-size: 12px; opacity: 0.8; font-weight: 600; margin-top: 2px; }
    .btn-out {
      background: rgba(255,255,255,.15);
      border: none;
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
    }
    .body { padding: 20px 16px 40px; max-width: 640px; margin: 0 auto; }
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-soft);
      margin-bottom: 14px;
    }
    .card h2 { margin: 0 0 8px; font-size: 16px; font-weight: 800; color: var(--green-dark); }
    .card p { margin: 0; font-size: 14px; color: var(--ink-muted); line-height: 1.55; }
    .badge {
      display: inline-block;
      background: var(--green-pale);
      color: var(--green-dark);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="app-header-row">
      <div>
        <div class="app-header-title">Portal Orang Tua</div>
        <div class="app-header-sub" id="subNama">Memuat…</div>
      </div>
      <button type="button" class="btn-out" id="btnLogout">Keluar</button>
    </div>
  </header>

  <div class="body">
    <div class="card">
      <span class="badge">Segera hadir</span>
      <h2>Nilai STS anak</h2>
      <p>
        Halaman ini akan menampilkan nilai Sumatif Tengah Semester setelah
        dipublish oleh guru kelas. Konten lengkap akan kita susun bersama.
      </p>
    </div>
    <div class="card">
      <h2>Pengaturan akun</h2>
      <p>
        Ganti password dan kelola anak yang terhubung akan tersedia di sini.
      </p>
    </div>
  </div>

  <script type="module">
    import { currentSession, onAuthChange, logout } from './assets/firebase.js';

    const session = currentSession();
    if (!session || session.role !== 'orangtua') {
      // Produksi: onAuthChange; demo: cek localStorage
      onAuthChange((s) => {
        if (!s || s.role !== 'orangtua') {
          window.location.href = 'index.html';
        } else {
          document.getElementById('subNama').textContent = s.nama || s.email;
        }
      });
    } else {
      document.getElementById('subNama').textContent = session.nama || session.email;
    }

    document.getElementById('btnLogout').addEventListener('click', async () => {
      await logout();
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
