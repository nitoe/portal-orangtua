<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#313083">
  <title>Rapor STS — Portal Orang Tua</title>
  <link rel="icon" type="image/png" href="assets/favicon-32.png">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .rapor-sheet {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      overflow: hidden;
    }
    .rapor-kop {
      border-bottom: 2px solid #0f172a;
      padding: 16px 16px 14px;
      display: flex; gap: 12px; align-items: flex-start;
    }
    .rapor-kop img { width: 48px; height: 48px; object-fit: contain; flex-shrink: 0; }
    .rapor-kop-text { flex: 1; min-width: 0; text-align: center; }
    .rapor-kop-text .school {
      font-size: 14px; font-weight: 700; color: #0f172a;
      letter-spacing: 0.02em; text-transform: uppercase;
    }
    .rapor-kop-text .addr { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.35; }
    .rapor-judul { text-align: center; padding: 12px 16px 4px; }
    .rapor-judul h2 {
      margin: 0; font-size: 15px; font-weight: 700;
      letter-spacing: 0.04em; text-transform: uppercase; color: #0f172a;
    }
    .rapor-judul p { margin: 4px 0 0; font-size: 12.5px; color: var(--muted); font-weight: 500; }
    .rapor-id {
      margin: 8px 16px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 16px;
      font-size: 12.5px;
    }
    @media (max-width: 520px) { .rapor-id { grid-template-columns: 1fr; } }
    .rapor-id dt { margin: 0; font-size: 11px; color: var(--muted); font-weight: 500; }
    .rapor-id dd { margin: 0; font-weight: 600; color: #0f172a; }
    .rapor-id .pair { display: flex; flex-direction: column; gap: 1px; }
    .rapor-section { padding: 0 16px 12px; }
    .rapor-section-title {
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.04em; color: #0f172a; margin: 0 0 8px;
      padding-bottom: 4px; border-bottom: 1px solid var(--border);
    }
    .rapor-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .rapor-table th {
      background: #f8fafc; border: 1px solid #cbd5e1; padding: 7px 8px;
      font-size: 11px; font-weight: 600; text-align: center; color: #334155;
    }
    .rapor-table td {
      border: 1px solid #cbd5e1; padding: 7px 8px; vertical-align: top; color: #0f172a;
    }
    .rapor-table td.num {
      text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; width: 3.2rem;
    }
    .rapor-table td.pred { text-align: center; font-size: 11.5px; width: 5.5rem; }
    .rapor-table td.mapel { text-align: left; font-weight: 500; }
    .rapor-foot {
      padding: 12px 16px 16px; border-top: 1px solid var(--border);
      font-size: 11.5px; color: var(--muted); line-height: 1.45;
    }
    .rapor-ttd {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
      padding: 8px 16px 20px; text-align: center; font-size: 11.5px; color: #334155;
    }
    @media (max-width: 520px) { .rapor-ttd { grid-template-columns: 1fr; gap: 16px; } }
    .rapor-ttd .slot strong {
      display: block; margin-top: 48px; font-size: 12.5px; color: #0f172a;
      text-decoration: underline; text-underline-offset: 3px;
    }
    .wait-box {
      background: #fff; border: 1px solid var(--border); border-radius: var(--radius-card);
      padding: 32px 20px; text-align: center;
    }
    .wait-box h2 { margin: 0 0 8px; font-size: 16px; font-weight: 600; color: #0f172a; }
    .wait-box p {
      margin: 0 auto; max-width: 380px; font-size: 13px; color: var(--muted); line-height: 1.55;
    }
    .countdown {
      margin: 16px auto 0;
      max-width: 280px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
    }
    .countdown-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .countdown-time {
      font-size: 22px;
      font-weight: 700;
      color: #313083;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }
    .countdown-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }
    .toolbar-rapor {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px;
    }
    .btn-print {
      border: 1px solid var(--border); background: #fff; border-radius: 8px;
      padding: 8px 12px; font-size: 13px; font-weight: 600; color: #0f172a; cursor: pointer;
    }
    .btn-print:hover { background: #f8fafc; }
    @media print {
      .sidebar, .top-header, .bottom-nav, .toolbar-rapor, .toast { display: none !important; }
      .app-shell, .main-col, .main-body { background: #fff !important; border: none !important; }
      .rapor-sheet { border: none; border-radius: 0; }
    }
  </style>
</head>
<body>
  <div class="app-frame">
    <div class="app-shell">
      <aside class="sidebar">
        <a class="sidebar-brand" href="beranda.html">
          <img src="assets/logo.png" alt="" onerror="this.style.visibility='hidden'">
          <div>
            <div class="sidebar-brand-title">SDM 01 Kukusan</div>
            <div class="sidebar-brand-sub">Portal Orang Tua</div>
          </div>
        </a>
        <p class="sidebar-section">Menu</p>
        <nav style="flex:1">
          <a class="side-link" href="beranda.html">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z"/></svg>
            Beranda
          </a>
          <a class="side-link active" href="rapor-sts.html">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            Rapor STS
          </a>
          <a class="side-link" href="capaian.html">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-5"/></svg>
            Ringkasan Capaian
          </a>
        </nav>
        <div class="hero-banner">
          <div class="hb-label">Masuk sebagai</div>
          <div class="hb-name" id="sideNama">—</div>
          <div class="hb-role">Orang tua</div>
        </div>
        <button type="button" class="side-logout" id="btnLogoutSide">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          Keluar
        </button>
      </aside>

      <div class="main-col">
        <header class="top-header">
          <div>
            <h1>Rapor STS</h1>
            <p class="date" id="tanggalHari">—</p>
          </div>
          <div class="top-actions">
            <div class="avatar-btn" id="avatarInisial">—</div>
            <button type="button" class="icon-btn mobile-only" id="btnLogoutTop" aria-label="Keluar">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            </button>
          </div>
        </header>

        <main class="main-body">
          <div class="main-inner" id="mainContent">
            <div class="wait-box"><p>Memuat rapor…</p></div>
          </div>
        </main>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="beranda.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z"/></svg>
      Beranda
    </a>
    <a class="active" href="rapor-sts.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      Rapor
    </a>
    <a href="capaian.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-5"/></svg>
      Capaian
    </a>
    <button type="button" id="btnLogoutNav">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      Keluar
    </button>
  </nav>

  <script type="module">
    import {
      currentSession,
      logout,
      loadSiswaByIds,
      loadRaporStsResmi,
    } from './assets/firebase.js?v=20261029s';
    import { dokumenRaporSts, cetakRaporSts } from './assets/rapor-resmi.js?v=20261029q';

    const $ = (id) => document.getElementById(id);
    $('tanggalHari').textContent = new Intl.DateTimeFormat('id-ID', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric',
    }).format(new Date());

    function inisial(nama) {
      if (!nama) return '?';
      const p = nama.trim().split(/\s+/);
      return p.length === 1
        ? p[0].slice(0, 2).toUpperCase()
        : (p[0][0] + p[p.length - 1][0]).toUpperCase();
    }
    function escapeHtml(s) {
      return String(s || '')
        .replace(/&/g, '&').replace(/</g, '<')
        .replace(/>/g, '>').replace(/"/g, '"');
    }
    function renderWaiting(pesan) {
      $('mainContent').innerHTML = `
        <div class="wait-box">
          <h2>Rapor STS belum tersedia</h2>
          <p>${pesan}</p>
        </div>`;
    }

    function pasangTinggi(frame) {
      const doc = frame.contentDocument;
      if (!doc || !doc.body) return;
      const h = Math.max(doc.body.scrollHeight, doc.documentElement.scrollHeight);
      frame.style.height = Math.max(640, h + 24) + 'px';
    }

    function renderResmi(rapor) {
      const html = dokumenRaporSts(rapor, 'layar');
      $('mainContent').innerHTML = `
        <div class="toolbar-rapor">
          <button type="button" class="btn-print" id="btnPrint">Cetak / simpan PDF</button>
          <span class="badge badge-ok">Sama dengan rapor STS di aplikasi penilaian</span>
        </div>
        <iframe id="lembarRapor" title="Rapor STS" sandbox="allow-same-origin allow-scripts"
          style="width:100%;border:1px solid var(--line,#e6e8ef);border-radius:12px;background:#fff;min-height:640px"></iframe>`;
      const frame = $('lembarRapor');
      frame.srcdoc = html;
      frame.addEventListener('load', () => pasangTinggi(frame));
      $('btnPrint').addEventListener('click', () => cetakRaporSts(rapor));
    }

    async function doLogout() {
      await logout();
      location.href = 'index.html';
    }
    document.getElementById('btnLogoutSide')?.addEventListener('click', doLogout);
    document.getElementById('btnLogoutTop')?.addEventListener('click', doLogout);
    document.getElementById('btnLogoutNav')?.addEventListener('click', doLogout);

    async function boot() {
      const s = currentSession();
      if (!s || s.role !== 'orangtua') {
        location.href = 'index.html';
        return;
      }
      $('sideNama').textContent = s.nama || 'Orang tua';
      const aktifId = s.siswaAktifId || (s.anakIds && s.anakIds[0]);
      if (!aktifId) {
        $('mainContent').innerHTML = `<div class="wait-box"><h2>Data anak tidak ditemukan</h2></div>`;
        return;
      }
      let anak = {
        id: aktifId,
        nama: s.siswaNama || aktifId,
        kelas: s.siswaKelas || '',
      };
      try {
        const list = await loadSiswaByIds([aktifId]);
        if (list[0]) {
          anak = { id: list[0].id, nama: list[0].nama, kelas: list[0].kelas || '' };
        }
      } catch (_) {}
      $('avatarInisial').textContent = inisial(anak.nama);

      try {
        const result = await loadRaporStsResmi(aktifId);
        if (!result.published || !result.rapor) {
          if (result.jadwalAt && result.jadwalLabel) {
            const target = new Date(result.jadwalAt);
            const periode = result.periodeLabel ? ` ${result.periodeLabel}` : '';
            $('mainContent').innerHTML = `
              <div class="wait-box">
                <h2>Rapor STS belum tersedia</h2>
                <p>Rapor STS${periode} dijadwalkan akan dibuka pada <strong>${escapeHtml(result.jadwalLabel)}</strong>.</p>
                <div class="countdown">
                  <div class="countdown-label">Tersisa</div>
                  <div class="countdown-time" id="cdTime">—</div>
                  <div class="countdown-sub" id="cdSub">Menghitung…</div>
                </div>
              </div>`;
            function tick() {
              const now = Date.now();
              const diff = target.getTime() - now;
              const el = document.getElementById('cdTime');
              const sub = document.getElementById('cdSub');
              if (!el) return;
              if (diff <= 0) {
                el.textContent = '00:00:00';
                sub.textContent = 'Waktu rilis telah tiba. Muat ulang halaman untuk melihat rapor.';
                return;
              }
              const sec = Math.floor(diff / 1000);
              const h = Math.floor(sec / 3600);
              const m = Math.floor((sec % 3600) / 60);
              const s = sec % 60;
              el.textContent = [h, m, s].map(n => String(n).padStart(2, '0')).join(':');
              sub.textContent = h > 0 ? `${h} jam ${m} menit lagi` : `${m} menit ${s} detik lagi`;
            }
            tick();
            setInterval(tick, 1000);
          } else {
            renderWaiting('Rapor STS belum dipublikasikan oleh wali kelas. Biasanya dibuka setelah penilaian selesai. Silakan cek kembali nanti atau tanyakan langsung ke wali kelas.');
          }
          return;
        }
        renderResmi(result.rapor);
      } catch (err) {
        console.error(err);
        $('mainContent').innerHTML = `<div class="wait-box"><h2>Gagal memuat rapor</h2><p>Periksa koneksi. Jika baru saja diperbarui, pastikan rules Firestore koleksi rapor_sts_ortu sudah di-deploy.</p></div>`;
      }
    }

    boot();
  </script>
</body>
</html>
