<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#313083">
  <title>Hasil Try Out TKA — Portal Orang Tua</title>
  <link rel="icon" type="image/png" href="assets/favicon-32.png">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    /* Try Out TKA — polish visual, tetap token portal */
    .tka-page-intro {
      background: linear-gradient(145deg, var(--muh-600) 0%, var(--muh-800) 100%);
      color: #fff;
      border-radius: var(--radius-card);
      padding: 16px 18px;
      margin-bottom: 16px;
    }
    .tka-page-intro h2 {
      margin: 0 0 6px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .tka-page-intro p {
      margin: 0;
      font-size: 13px;
      line-height: 1.5;
      opacity: 0.92;
    }

    .tka-tahap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 0;
      margin-bottom: 14px;
      overflow: hidden;
    }
    .tka-tahap-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: #fafbfc;
    }
    .tka-tahap-head h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.01em;
    }
    .tka-tahap-body { padding: 14px; }

    .tka-meta {
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 12px;
    }

    .tka-nilai-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    @media (max-width: 380px) {
      .tka-nilai-grid { grid-template-columns: 1fr; }
    }
    .tka-nilai-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 10px;
      text-align: center;
    }
    .tka-nilai-card .lbl {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .tka-nilai-card .val {
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
      line-height: 1.15;
    }
    .tka-nilai-card .val.muted {
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
    }

    .tka-rank-box {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      align-items: center;
      background: var(--muh-50);
      border: 1px solid var(--muh-200);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
      font-size: 13px;
      color: #0f172a;
    }
    .tka-rank-box strong { color: var(--muh-700); }
    .tka-rank-num {
      font-size: 20px;
      font-weight: 800;
      color: var(--muh-700);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .tka-catatan {
      font-size: 13px;
      color: #334155;
      background: #f8fafc;
      border-radius: 8px;
      padding: 10px 12px;
      border: 1px dashed #cbd5e1;
      margin-bottom: 10px;
      line-height: 1.45;
    }
    .tka-catatan-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #64748b;
      margin-bottom: 4px;
    }

    .tka-wait-box {
      font-size: 13px;
      color: #92400e;
      background: var(--attention-tint);
      border: 1px solid #fde68a;
      border-radius: 10px;
      padding: 14px;
      line-height: 1.5;
    }
    .tka-wait-box strong { display: block; margin-bottom: 4px; }

    .tka-empty-note {
      font-size: 13px;
      color: var(--muted);
      margin: 0;
      padding: 4px 0 2px;
    }

    .tka-top10 { margin-top: 4px; }
    .tka-top10 h3 {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .tka-top10-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .tka-top10 table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 280px;
    }
    .tka-top10 th,
    .tka-top10 td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }
    .tka-top10 th {
      font-size: 11px;
      color: #64748b;
      font-weight: 700;
      background: #f8fafc;
      white-space: nowrap;
    }
    .tka-top10 tr:last-child td { border-bottom: none; }
    .tka-top10 tr.me {
      background: var(--muh-50);
      font-weight: 600;
    }
    .tka-top10 tr.me td:first-child { color: var(--muh-700); }

    .badge-ok {
      display: inline-flex;
      align-items: center;
      background: var(--ok-tint);
      color: var(--ok);
      border: 1px solid #a7f3d0;
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 11px;
      font-weight: 700;
    }
    .badge-wait {
      display: inline-flex;
      align-items: center;
      background: var(--attention-tint);
      color: var(--attention);
      border: 1px solid #fde68a;
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 11px;
      font-weight: 700;
    }

    .tka-footer-hint {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="app-frame">
    <div class="app-shell">
      <aside class="sidebar">
        <a class="sidebar-brand" href="beranda.html">
          <img src="assets/logo.png" alt="" onerror="this.style.visibility='hidden'">
          <div>
            <div class="sidebar-brand-title">SDM 01 Kukusan</div>
            <div class="sidebar-brand-sub">Portal Orang Tua</div>
          </div>
        </a>
        <p class="sidebar-section">Menu</p>
        <nav style="flex:1">
          <a class="side-link" href="beranda.html">Beranda</a>
          <a class="side-link" href="rapor-sts.html">Rapor STS</a>
          <a class="side-link" href="capaian.html">Ringkasan Capaian</a>
          <a class="side-link" href="lima-besar.html">Lima Besar</a>
          <a class="side-link active" href="tryout-tka.html">Try Out TKA</a>
        </nav>
        <button type="button" class="side-link" id="btnLogoutSide" style="border:0;background:transparent;width:100%;text-align:left;cursor:pointer">Keluar</button>
      </aside>
      <main class="main">
        <header class="topbar">
          <div>
            <div class="topbar-title">Hasil Try Out TKA</div>
            <div class="topbar-sub" id="subAnak">—</div>
          </div>
          <button type="button" class="btn-ghost" id="btnLogoutTop">Keluar</button>
        </header>
        <div class="main-inner" id="mainContent">
          <p class="text-muted">Memuat…</p>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import {
      currentSession,
      logout,
      loadSiswaByIds,
      loadTryOutTkaAnak,
      isKelasEnamTka,
    } from './assets/firebase.js';

    const $ = (id) => document.getElementById(id);

    function escapeHtml(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function fmtNilai(v) {
      if (v == null || Number.isNaN(Number(v))) return null;
      const n = Number(v);
      return Number.isInteger(n) ? String(n) : n.toLocaleString('id-ID', { maximumFractionDigits: 1 });
    }

    function kartuNilai(label, val) {
      const f = fmtNilai(val);
      if (f == null) {
        return `<div class="tka-nilai-card"><div class="lbl">${label}</div><div class="val muted">Belum diujikan</div></div>`;
      }
      return `<div class="tka-nilai-card"><div class="lbl">${label}</div><div class="val">${f}</div></div>`;
    }

    function render(anak, data) {
      if (!data.khususKelas6) {
        $('mainContent').innerHTML = `
          <div class="tka-wait-box">
            <strong>Khusus orang tua kelas 6</strong>
            Hasil Try Out TKA ditampilkan untuk siswa kelas 6A dan 6B.
            Anak Anda saat ini di kelas <strong>${escapeHtml(anak.kelas || '—')}</strong>.
          </div>`;
        return;
      }

      const parts = [];
      parts.push(`
        <div class="tka-page-intro">
          <h2>Try Out TKA — Kelas 6</h2>
          <p>
            Memantau kesiapan akademik (Bahasa Indonesia, Matematika, IPA).
            Nilai muncul setelah <strong>wali kelas mempublikasikan</strong> tahap terkait.
            Ini bukan rapor semester resmi.
          </p>
        </div>`);

      let adaPublished = false;
      for (const t of data.tahapList || []) {
        if (!t.published) {
          parts.push(`
            <section class="tka-tahap">
              <div class="tka-tahap-head">
                <h2>${escapeHtml(t.nama)}</h2>
                <span class="badge-wait">Belum dipublikasikan</span>
              </div>
              <div class="tka-tahap-body">
                <p class="tka-empty-note">Menunggu wali kelas membuka hasil tahap ini. Silakan cek kembali nanti.</p>
              </div>
            </section>`);
          continue;
        }
        adaPublished = true;

        const n = t.nilai || {};
        let rankHtml = '';
        if (t.peringkat != null && t.jumlahPesertaRanking) {
          rankHtml = `
            <div class="tka-rank-box">
              <div>
                <span style="font-size:11px;font-weight:700;color:var(--muh-700);text-transform:uppercase;letter-spacing:0.04em">Peringkat anak</span>
                <div class="tka-rank-num">#${t.peringkat}</div>
              </div>
              <div style="flex:1;min-width:140px">
                dari <strong>${t.jumlahPesertaRanking}</strong> peserta (gabungan 6A &amp; 6B)
                ${t.rataRata != null ? `<br>Rata-rata: <strong>${fmtNilai(t.rataRata)}</strong>` : ''}
              </div>
            </div>`;
        } else if (t.rataRata != null) {
          rankHtml = `
            <div class="tka-rank-box">
              <div>
                Rata-rata: <strong>${fmtNilai(t.rataRata)}</strong>
                <span style="display:block;font-size:12px;color:#64748b;font-weight:500;margin-top:2px">
                  Belum masuk ranking — nilai mapel wajib belum lengkap
                </span>
              </div>
            </div>`;
        }

        const top = (data.top10ByTahap && data.top10ByTahap[t.tahap]) || [];
        let topHtml = '';
        if (top.length) {
          const rows = top.map((r) => {
            const me = r.siswaId === anak.id ? ' class="me"' : '';
            const nama = escapeHtml(r.siswaNama) + (r.siswaId === anak.id ? ' <span style="color:var(--muh-700)">(anak Anda)</span>' : '');
            return `<tr${me}>
              <td>${r.peringkat}</td>
              <td>${nama}</td>
              <td>${escapeHtml(r.kelas)}</td>
              <td class="tabular">${fmtNilai(r.rataRata) ?? '—'}</td>
            </tr>`;
          }).join('');
          topHtml = `
            <div class="tka-top10">
              <h3>10 besar kelas 6 (6A + 6B)</h3>
              <div class="tka-top10-wrap">
                <table>
                  <thead>
                    <tr><th>#</th><th>Nama</th><th>Kelas</th><th>Rata-rata</th></tr>
                  </thead>
                  <tbody>${rows}</tbody>
                </table>
              </div>
            </div>`;
        }

        parts.push(`
          <section class="tka-tahap">
            <div class="tka-tahap-head">
              <h2>${escapeHtml(t.nama)}</h2>
              <span class="badge-ok">Dipublikasikan</span>
            </div>
            <div class="tka-tahap-body">
              ${t.publishedAt ? `<p class="tka-meta">Dibuka ${escapeHtml(t.publishedAt)}</p>` : ''}
              <div class="tka-nilai-grid">
                ${kartuNilai('BI', n.BI)}
                ${kartuNilai('Matematika', n.MTK)}
                ${kartuNilai('IPA', n.IPA)}
              </div>
              ${rankHtml}
              ${t.catatanOrtu ? `<div class="tka-catatan"><span class="tka-catatan-label">Catatan wali kelas</span>${escapeHtml(t.catatanOrtu)}</div>` : ''}
              ${topHtml}
            </div>
          </section>`);
      }

      if (!adaPublished) {
        parts.push(`
          <p class="tka-footer-hint">
            Belum ada tahap yang dipublikasikan. Hasil akan muncul di sini setelah wali kelas 6A/6B membuka nilai Try Out.
          </p>`);
      } else {
        parts.push(`
          <p class="tka-footer-hint">
            Nilai di halaman ini adalah snapshot yang dipublikasikan wali kelas. Bukan rapor semester.
          </p>`);
      }

      $('mainContent').innerHTML = parts.join('');
    }

    async function doLogout() {
      await logout();
      location.href = 'index.html';
    }
    $('btnLogoutSide')?.addEventListener('click', doLogout);
    $('btnLogoutTop')?.addEventListener('click', doLogout);

    async function boot() {
      const s = currentSession();
      if (!s || s.role !== 'orangtua') {
        location.href = 'index.html';
        return;
      }
      const aktifId = s.siswaAktifId || (s.anakIds && s.anakIds[0]);
      if (!aktifId) {
        $('mainContent').innerHTML = '<div class="tka-wait-box"><strong>Data anak tidak ditemukan.</strong></div>';
        return;
      }
      let anak = { id: aktifId, nama: s.siswaNama || aktifId, kelas: s.siswaKelas || '' };
      try {
        const list = await loadSiswaByIds([aktifId]);
        if (list[0]) anak = { id: list[0].id, nama: list[0].nama, kelas: list[0].kelas || '' };
      } catch (_) {}
      $('subAnak').textContent = `${anak.nama} · ${anak.kelas || '—'}`;

      try {
        const data = await loadTryOutTkaAnak(anak.id, anak.kelas);
        render(anak, data);
      } catch (e) {
        console.error(e);
        $('mainContent').innerHTML = `
          <div class="tka-wait-box">
            <strong>Gagal memuat hasil</strong>
            Periksa koneksi internet. Jika berlanjut, pastikan rules koleksi
            <code>lms_tka_*</code> sudah di-deploy di Firebase.
          </div>`;
      }
    }
    boot();
  </script>
</body>
</html>
