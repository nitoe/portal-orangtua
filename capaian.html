<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#313083">
  <title>Ringkasan Capaian — Portal Orang Tua</title>
  <link rel="icon" type="image/png" href="assets/favicon-32.png">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .disclaimer {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 12px 14px;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 16px;
      line-height: 1.45;
    }
    .disclaimer strong { color: #0f172a; }

    .follow-card {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: var(--radius-card);
      padding: 14px 16px;
      margin-bottom: 16px;
    }
    .follow-card h3 {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 700;
      color: #92400e;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .follow-list { margin: 0; padding: 0; list-style: none; }
    .follow-list li {
      font-size: 13px;
      line-height: 1.45;
      padding: 6px 0;
      border-bottom: 1px solid #fef3c7;
      color: #78350f;
    }
    .follow-list li:last-child { border-bottom: none; }
    .follow-list .mapel { font-weight: 600; color: #92400e; }

    .bars-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 14px 16px;
      margin-bottom: 16px;
    }
    .bars-card h3 {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .bar-row {
      display: grid;
      grid-template-columns: minmax(0, 110px) 1fr 42px;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12.5px;
    }
    .bar-row:last-child { margin-bottom: 0; }
    .bar-label { font-weight: 600; color: #0f172a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { height: 10px; background: #e2e8f0; border-radius: 5px; overflow: hidden; }
    .bar-fill { height: 100%; background: #313083; border-radius: 5px; }
    .bar-val { text-align: right; font-weight: 600; color: #0f172a; }

    .mapel-grid {
      display: grid;
      gap: 12px;
    }
    .mapel-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 14px 16px;
    }
    .mapel-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 10px;
    }
    .mapel-name { margin: 0; font-size: 15px; font-weight: 700; color: #0f172a; }
    .mapel-score { text-align: right; }
    .mapel-score .num { font-size: 20px; font-weight: 700; color: #313083; line-height: 1; }
    .mapel-score .pred { font-size: 11px; font-weight: 600; color: var(--muted); margin-top: 2px; }

    .block { margin-top: 10px; }
    .block-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    .block-ok .block-label { color: #059669; }
    .block-need .block-label { color: #d97706; }
    .block p { margin: 0; font-size: 13px; line-height: 1.5; color: #334155; }
    .block-ok p { color: #065f46; }
    .block-need p { color: #92400e; }

    .legend {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 14px 16px;
      margin-top: 16px;
    }
    .legend h3 {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
    }
    .legend-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .legend-table td { padding: 5px 0; border-bottom: 1px solid #f1f5f9; }
    .legend-table td:first-child { font-weight: 600; color: #0f172a; width: 120px; }
    .legend-table tr:last-child td { border-bottom: none; }
    .legend p { margin: 10px 0 0; font-size: 12px; color: var(--muted); line-height: 1.45; }
  </style>
</head>
<body>
  <div class="app-frame">
    <div class="app-shell">
      <aside class="sidebar">
        <a class="sidebar-brand" href="beranda.html">
          <img src="assets/logo.png" alt="" onerror="this.style.visibility='hidden'">
          <div>
            <div class="sidebar-brand-title">SDM 01 Kukusan</div>
            <div class="sidebar-brand-sub">Portal Orang Tua</div>
          </div>
        </a>
        <p class="sidebar-section">Menu</p>
        <nav style="flex:1">
          <a class="side-link" href="beranda.html">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z"/></svg>
            Beranda
          </a>
          <a class="side-link" href="rapor-sts.html">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            Rapor STS
          </a>
          <a class="side-link active" href="capaian.html">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-5"/></svg>
            Ringkasan Capaian
          </a>
        </nav>
        <div class="hero-banner">
          <div class="hb-label">Masuk sebagai</div>
          <div class="hb-name" id="sideNama">—</div>
          <div class="hb-role">Orang tua</div>
        </div>
        <button type="button" class="side-logout" id="btnLogoutSide">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          Keluar
        </button>
      </aside>

      <div class="main-col">
        <header class="top-header">
          <div>
            <h1>Ringkasan Capaian</h1>
            <p class="date" id="tanggalHari">—</p>
          </div>
          <div class="top-actions">
            <div class="avatar-btn" id="avatarInisial">—</div>
            <button type="button" class="icon-btn mobile-only" id="btnLogoutTop" aria-label="Keluar">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            </button>
          </div>
        </header>

        <main class="main-body">
          <div class="main-inner" id="mainContent">
            <div class="wait-box"><p>Memuat ringkasan…</p></div>
          </div>
        </main>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="beranda.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z"/></svg>
      Beranda
    </a>
    <a href="rapor-sts.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      Rapor
    </a>
    <a class="active" href="capaian.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-5"/></svg>
      Capaian
    </a>
  </nav>

  <script type="module">
    import {
      currentSession,
      logout,
      loadSiswaByIds,
      loadRaporStsResmi,
    } from './assets/firebase.js?v=20261029p';

    const $ = (id) => document.getElementById(id);
    $('tanggalHari').textContent = new Intl.DateTimeFormat('id-ID', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric',
    }).format(new Date());

    function inisial(nama) {
      if (!nama) return '?';
      const p = nama.trim().split(/\s+/);
      return p.length === 1
        ? p[0].slice(0, 2).toUpperCase()
        : (p[0][0] + p[p.length - 1][0]).toUpperCase();
    }
    function escapeHtml(s) {
      return String(s || '')
        .replace(/&/g, '&').replace(/</g, '<')
        .replace(/>/g, '>').replace(/"/g, '"');
    }

    // Ambang dari akademikRumus.ts LEVEL_RANGE_DEFAULT (pengetahuan).
    // Jangan diubah tanpa menyalin ulang dari aplikasi penilaian.
    function predikat(nilai) {
      const n = Number(nilai);
      if (!Number.isFinite(n)) return '—';
      if (n >= 90) return 'Sangat Baik';
      if (n >= 84) return 'Baik';
      if (n >= 75) return 'Cukup';
      return 'Perlu Bimbingan';
    }

    function renderWaiting(pesan) {
      $('mainContent').innerHTML = `
        <div class="wait-box">
          <h2>Ringkasan belum siap</h2>
          <p>${pesan}</p>
          <p style="margin-top:8px;font-size:13px;color:var(--muted)">Rapor STS resmi tetap dapat dilihat di halaman Rapor STS setelah dipublikasikan.</p>
        </div>`;
    }

    function render(rapor) {
      const baris = Array.isArray(rapor.baris) ? rapor.baris : [];
      const perluItems = [];
      const cards = [];

      for (const b of baris) {
        const mapel = escapeHtml(b.mapel || 'Mapel');
        const nilai = b.nilaiAkhir == null || b.nilaiAkhir === '' ? null : Number(b.nilaiAkhir);
        const nilaiText = nilai == null ? '—' : String(nilai);
        const pred = nilai == null ? '—' : predikat(nilai);
        const kalimat = Array.isArray(b.capaian) ? b.capaian.filter(Boolean) : [];
        const terbaik = kalimat[0] || '';
        const perlu = kalimat.slice(1);

        for (const p of perlu) {
          perluItems.push({ mapel: b.mapel || 'Mapel', teks: p });
        }

        const blokOk = terbaik
          ? `<div class="block block-ok"><div class="block-label">Sudah dikuasai</div><p>${escapeHtml(terbaik)}</p></div>`
          : '';
        const blokNeed = perlu.length
          ? `<div class="block block-need"><div class="block-label">Perlu didampingi</div>${perlu.map(p => `<p>${escapeHtml(p)}</p>`).join('')}</div>`
          : '';

        cards.push(`
          <article class="mapel-card">
            <div class="mapel-head">
              <h3 class="mapel-name">${mapel}</h3>
              <div class="mapel-score">
                <div class="num">${escapeHtml(nilaiText)}</div>
                <div class="pred">${escapeHtml(pred)}</div>
              </div>
            </div>
            ${blokOk}
            ${blokNeed}
            ${!blokOk && !blokNeed ? '<p style="margin:0;font-size:13px;color:var(--muted)">Deskripsi capaian belum tersedia.</p>' : ''}
          </article>
        `);
      }

      const followHtml = perluItems.length
        ? `<section class="follow-card">
            <h3>Perlu didampingi</h3>
            <ul class="follow-list">
              ${perluItems.map(i => `<li><span class="mapel">${escapeHtml(i.mapel)}:</span> ${escapeHtml(i.teks)}</li>`).join('')}
            </ul>
          </section>`
        : `<section class="follow-card" style="background:#ecfdf5;border-color:#a7f3d0">
            <h3 style="color:#065f46">Tidak ada poin yang perlu didampingi</h3>
            <p style="margin:0;font-size:13px;color:#065f46">Semua mapel yang dinilai hanya menampilkan capaian terbaik.</p>
          </section>`;

      const bars = baris
        .filter(b => b.nilaiAkhir != null && b.nilaiAkhir !== '')
        .map(b => {
          const n = Math.max(0, Math.min(100, Number(b.nilaiAkhir)));
          return `<div class="bar-row">
            <div class="bar-label" title="${escapeHtml(b.mapel)}">${escapeHtml(b.mapel || 'Mapel')}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${n}%"></div></div>
            <div class="bar-val">${escapeHtml(String(b.nilaiAkhir))}</div>
          </div>`;
        }).join('');

      const barsHtml = bars
        ? `<section class="bars-card">
            <h3>Gambaran nilai akhir</h3>
            ${bars}
            <p style="margin:10px 0 0;font-size:12px;color:var(--muted)">Batang menunjukkan nilai akhir mapel milik anak ini saja. Tidak ada perbandingan dengan siswa lain.</p>
          </section>`
        : '';

      $('mainContent').innerHTML = `
        <div class="disclaimer">
          <strong>Penjelasan pendamping, bukan rapor resmi.</strong>
          Halaman ini memecah kalimat capaian yang sudah ada di rapor STS agar lebih mudah dibaca.
          Angka dan kalimat berasal dari dokumen yang sama dengan halaman Rapor STS.
          Rapor resmi tetap di <a href="rapor-sts.html">halaman Rapor STS</a>.
        </div>

        ${followHtml}
        ${barsHtml}

        <section class="mapel-grid">
          ${cards.join('') || '<div class="wait-box"><p>Belum ada data mapel.</p></div>'}
        </section>

        <section class="legend">
          <h3>Cara membaca nilai</h3>
          <table class="legend-table">
            <tr><td>Sangat Baik</td><td>90 – 100</td></tr>
            <tr><td>Baik</td><td>84 – 89</td></tr>
            <tr><td>Cukup</td><td>75 – 83</td></tr>
            <tr><td>Perlu Bimbingan</td><td>0 – 74</td></tr>
          </table>
          <p>Ambang ini mengikuti skala default di aplikasi penilaian (<code>LEVEL_RANGE_DEFAULT</code> pada <code>akademikRumus.ts</code>). Predikat pada rapor resmi tetap ditentukan oleh aplikasi penilaian.</p>
        </section>
      `;
    }

    async function boot() {
      const s = currentSession();
      if (!s || s.role !== 'orangtua') {
        location.href = 'index.html';
        return;
      }
      $('sideNama').textContent = s.nama || 'Orang tua';
      const aktifId = s.siswaAktifId || (s.anakIds && s.anakIds[0]);
      if (!aktifId) {
        $('mainContent').innerHTML = `<div class="wait-box"><h2>Data anak tidak ditemukan</h2></div>`;
        return;
      }
      let anak = {
        id: aktifId,
        nama: s.siswaNama || aktifId,
        kelas: s.siswaKelas || '',
      };
      try {
        const list = await loadSiswaByIds([aktifId]);
        if (list[0]) {
          anak = { id: list[0].id, nama: list[0].nama, kelas: list[0].kelas || '' };
        }
      } catch (_) {}
      $('avatarInisial').textContent = inisial(anak.nama);

      const hasil = await loadRaporStsResmi(aktifId);
      if (!hasil.published) {
        const alasan = hasil.reason === 'gerbang'
          ? 'Rapor STS belum dipublikasikan oleh wali kelas.'
          : 'Belum ada data rapor STS untuk anak ini.';
        renderWaiting(alasan);
        return;
      }
      render(hasil.rapor);
    }

    document.getElementById('btnLogoutSide')?.addEventListener('click', logout);
    document.getElementById('btnLogoutTop')?.addEventListener('click', logout);
    boot();
  </script>
</body>
</html>
